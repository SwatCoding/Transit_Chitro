<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Transit Chitro</title>
  <link rel="icon" type="image/png" href="transitchitrofavicon64x64.png">
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/lightbox.min.css" />
  <style>
    .svg-container {
      position: relative;
      width: 80vmin;
      aspect-ratio: 1647.44104 / 1182.55896;
      border: 1px solid #555;
      margin: 30px auto;
      overflow: hidden;
      background: #f9f9f9;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #pan-container {
      width: 100%;
      height: 100%;
      overflow: hidden;
      cursor: grab;
    }

    .controls {
      position: absolute;
      top: 10px;
      right: 10px;
      display: flex;
      flex-direction: column;
      gap: 5px;
      z-index: 10;
      pointer-events: auto;
    }

    .controls button {
      background: #333;
      color: white;
      border: none;
      padding: 5px 8px;
      font-size: 16px;
      cursor: pointer;
      border-radius: 4px;
    }

    .controls button:hover {
      background: #555;
    }

    .paragraph {
      text-align: center;
      max-width: 1000px;
      margin: 20px auto;
      font-size: 16px;
      line-height: 1.6;
    }
  </style>
</head>

<body>
  <div class="page-container">

    <!-- Navbar -->
    <div id="navbar"></div>

    <!-- Title and Map -->
    <main style="text-align: center;">

      <h3>Schematic Map of Pune Metro and Suburban Railway</h3> 

      <div class="svg-container">
        <div class="controls">
          <button onclick="zoom(1.1, svgWrapperCenterX(), svgWrapperCenterY())">+</button>
          <button onclick="zoom(0.9, svgWrapperCenterX(), svgWrapperCenterY())">−</button>
        </div>
        <div id="pan-container">
          <img id="map" src="images/metro/pune500.png" alt="Pune Metro Map" style="max-width:none; transform-origin: 0 0; transform: translate(0px, 0px) scale(1);">
        </div>
      </div>

      <script>
const panContainer = document.getElementById('pan-container');
const map = document.getElementById('map');

let scale = 1;
let translate = { x: 0, y: 0 };
let isPanning = false;
let start = { x: 0, y: 0 };

let minScale = 0.5; // will be overwritten with fitScale
const maxScale = 5;

function clampTranslate() {
  const containerRect = panContainer.getBoundingClientRect();
  const imgWidth = map.naturalWidth * scale;
  const imgHeight = map.naturalHeight * scale;

  const minX = Math.min(0, containerRect.width - imgWidth);
  const minY = Math.min(0, containerRect.height - imgHeight);

  translate.x = Math.min(Math.max(translate.x, minX), 0);
  translate.y = Math.min(Math.max(translate.y, minY), 0);
}

function applyTransform() {
  clampTranslate();
  map.style.transform = `translate(${translate.x}px, ${translate.y}px) scale(${scale})`;
}

function svgWrapperCenterX() {
  const rect = panContainer.getBoundingClientRect();
  return rect.left + rect.width / 2;
}

function svgWrapperCenterY() {
  const rect = panContainer.getBoundingClientRect();
  return rect.top + rect.height / 2;
}

// Smooth mouse-centered zoom
window.zoom = function (factor, mouseX, mouseY) {
  const rect = panContainer.getBoundingClientRect();
  const offsetX = mouseX - rect.left - translate.x;
  const offsetY = mouseY - rect.top - translate.y;

  const prevScale = scale;
  scale *= factor;
  scale = Math.max(minScale, Math.min(maxScale, scale));

  translate.x -= (offsetX / prevScale) * (scale - prevScale);
  translate.y -= (offsetY / prevScale) * (scale - prevScale);

  applyTransform();
};

// Calculate initial scale after fitting image
let fitScale = 1;

window.addEventListener('load', () => {
  const containerRect = panContainer.getBoundingClientRect();
  const imgRatio = map.naturalWidth / map.naturalHeight;
  const containerRatio = containerRect.width / containerRect.height;

  if (imgRatio > containerRatio) {
    fitScale = containerRect.width / map.naturalWidth;
  } else {
    fitScale = containerRect.height / map.naturalHeight;
  }

  scale = fitScale;
  minScale = fitScale; // prevent zooming out beyond fit
  translate.x = (containerRect.width - map.naturalWidth * scale) / 2;
  translate.y = (containerRect.height - map.naturalHeight * scale) / 2;
  applyTransform();
});

// Wheel zoom — smoother
panContainer.addEventListener('wheel', function (e) {
  e.preventDefault();
  const zoomIntensity = 0.0015; // smoother & smaller step
  const factor = 1 - e.deltaY * zoomIntensity;
  zoom(factor, e.clientX, e.clientY);
}, { passive: false });

// Mouse drag panning
panContainer.addEventListener('mousedown', function (e) {
  isPanning = true;
  start = { x: e.clientX - translate.x, y: e.clientY - translate.y };
  panContainer.style.cursor = 'grabbing';
});

window.addEventListener('mouseup', function () {
  isPanning = false;
  panContainer.style.cursor = 'grab';
});

window.addEventListener('mousemove', function (e) {
  if (!isPanning) return;
  translate.x = e.clientX - start.x;
  translate.y = e.clientY - start.y;
  applyTransform();
});
</script>

      <!-- Footer -->
      <div id="footer"></div>
  </div>
  <script src="js/include.js"></script>
</body>
</html>
