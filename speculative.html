<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Transit Chitro</title>
  <link rel="icon" type="image/png" href="transitchitrofavicon64x64.png">
  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/navbar_footer.css" />
  <link rel="stylesheet" href="css/lightbox.min.css" />
  <style>
    .city-grid-container {
      display: flex;
      flex-direction: column;
      gap: 40px;
      padding: 30px;
      max-width: 1200px;
      margin: auto;
    }

    .service-group h4 {
      margin: 10px 0;
      font-size: 1.5rem;
      border-bottom: 2px solid #12456A;
      padding-bottom: 5px;
    }

    .city-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
    }

    .city-grid .image-box {
      width: 150px;
    }

    .city-grid .image-box img {
      height: 120px;
      width: 100%;
      object-fit: cover;
      border-radius: 4px;
    }

    .image-caption {
      background-color: rgba(0, 0, 0, 0.7);
      color: white;
      font-size: 14px;
      text-align: center;
      padding: 5px 0;
      border-radius: 0 0 4px 4px;
    }

    .image-box a {
      text-decoration: none;
      color: inherit;
    }

    .image-box:hover img {
      opacity: 0.85;
    }
  </style>
</head>

<body>
  <div class="page-container">

    <!-- Navbar -->
    <div id="navbar"></div>

    <!-- Title and Map -->
    <main style="text-align: center;">

      <!-- City Grids -->
      <div class="city-grid-container">

        <!-- Group A -->
        <div class="service-group">
          <h4>A</h4>
          <div class="city-grid">

            <div class="image-box">
              <a href="asansol.html">
                <img src="images/others/asansol/asansolclip.png" alt="Asansol Metro Map">
                <div class="image-caption">"Asansol Metro Map</div>
              </a>
           </div>
            <!-- Add more A cities here -->   
           </div>
        </div>

        <!-- Group B -->
        <div class="service-group">
          <h4>B</h4>
          <div class="city-grid">

            <div class="image-box">
              <a href="burdwan.html">
                <img src="images/others/burdwan/burdwanclip.png" alt="Burdwan Metro Map">
                <div class="image-caption">Burdwan Metro Map</div>
              </a> 
            </div>
            <!-- Add more B cities here -->
          </div>
        </div>

        <!-- Group D -->
        <div class="service-group">
          <h4>D</h4>
          <div class="city-grid">

            <div class="image-box">
              <a href="Durgapur.html">
                <img src="images/others/durgapur/durgapurclip.png" alt="Durgapur Metro Map">
                <div class="image-caption">Durgapur Metro Map</div>
              </a>
            </div>
            <!-- Add more B cities here -->
          </div>
        </div>

        <!-- Group S -->
        <div class="service-group">
          <h4>S</h4>
          <div class="city-grid">

            <div class="image-box">
              <a href="siliguri.html">
                <img src="images/others/siliguri/siliguriclip.png" alt="Siliguri Metro Map">
                <div class="image-caption">Siliguri Metro Map</div>
              </a>
            </div>   
            <!-- Add more B cities here -->
          </div>
        </div>    

        <!-- Continue with C, D, E... -->

      </div>
    </main>

    <!-- Footer -->
    <div id="footer"></div>

  </div>

<script src="js/include.js"></script>

</body>
</html>
